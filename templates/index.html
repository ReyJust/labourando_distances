<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Labourando distances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bs-primary: #1cab57; }
      body { padding-top: 4.5rem; background:#f6f7fb; }
      .result-card { min-height: 120px; }
      .center-box { display:flex; justify-content:center; margin-top:4rem; }
      .center-box .card { width:50%; min-width:320px; }
      .arrow { display:flex; align-items:center; justify-content:center; padding:0; align-self:center; }
      .btn-primary {
        background-color: #1cab57 !important;
        border-color: #1cab57 !important;
      }
      .btn-primary:hover,
      .btn-primary:focus {
        background-color: #17a04e !important;
        border-color: #17a04e !important;
        box-shadow: 0 0 0 0.25rem rgba(28, 171, 87, 0.35) !important;
      }
      .form-control:focus,
      .form-range:focus,
      .btn:focus {
        box-shadow: 0 0 0 0.25rem rgba(28, 171, 87, 0.25) !important;
        border-color: #1cab57 !important;
      }
      .form-range {
        accent-color: #1cab57;
      }
      .form-range::-webkit-slider-thumb {
        background-color: #1cab57;
      }
      .form-range::-moz-range-thumb {
        background-color: #1cab57;
      }
      @media (max-width: 900px) {
        .center-box .card { width:92%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="center-box">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title text-center">Check driving distance between suburbs</h5>
              <form id="f" class="g-3">
                <div class="d-flex gap-2 align-items-center mb-2">
                  <div class="flex-grow-1">
                    <label class="form-label">From</label>
                    <input class="form-control" name="my_suburb" placeholder="e.g. Allawah" required value="Allawah">
                  </div>
                  <div class="px-2 d-flex align-items-center arrow" aria-hidden="true" style="font-size:1.4rem;">
                    ➜
                  </div>
                  <div class="flex-grow-1">
                    <label class="form-label">To</label>
                    <input class="form-control" name="work_suburb" placeholder="e.g. Rouse Hill" required value="Rouse Hill">
                  </div>
                </div>

                <div class="d-flex align-items-center gap-2 mb-3">
                  <div style="flex:1">
                    <label class="form-label">Threshold (km)</label>
                    <input id="slider" name="distance_threshold" type="range" min="5" max="100" step="1" value="15" class="form-range">
                  </div>
                  <div style="width:20%">
                    <label class="form-label">Value</label>
                    <input id="num" class="form-control" type="number" min="5" max="100" step="1" value="15" />
                  </div>
                </div>

                <div class="mt-2">
                  <button type="submit" class="btn btn-primary w-100" id="btn">Check</button>
                </div>
              </form>

              <div class="mt-4">
                <div id="result" class="result-card alert d-none" role="alert"></div>
                <div id="meta" class="small text-muted mt-2"></div>
              </div>
            </div>
          </div>
        </div>
        <p class="text-muted mt-3 small text-center">This page calls the server API and shows the method used (ORS / OSRM / haversine).</p>
      </div>
    </main>

    <script>
      const f = document.getElementById('f');
      const resultEl = document.getElementById('result');
      const metaEl = document.getElementById('meta');
      const btn = document.getElementById('btn');

      async function showResult(obj) {
        if (!obj) return;
        if (obj.error) {
          resultEl.className = 'alert alert-danger';
          resultEl.textContent = obj.error;
          metaEl.textContent = '';
          resultEl.classList.remove('d-none');
          return;
        }
        const within = obj.within;
        const dist = obj.distance_km;
        const method = obj.method;
        resultEl.className = within ? 'alert alert-success' : 'alert alert-warning';
        resultEl.innerHTML = `<strong>${within ? 'Within' : 'Not within' } threshold</strong>` + (dist!==null ? `<div>Distance: ${dist.toFixed(3)} km</div>` : '');
        metaEl.textContent = method ? `method: ${method}` : '';
        resultEl.classList.remove('d-none');
      }

      f.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        resultEl.classList.add('d-none');
        metaEl.textContent = '';
        btn.disabled = true;
        const form = new FormData(f);
        const payload = {};
        form.forEach((v,k)=>payload[k]=v);
        try {
          const res = await fetch('/api/check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          const j = await res.json();
          await showResult(j);
        } catch (err) {
          resultEl.className = 'alert alert-danger';
          resultEl.textContent = 'Request failed: ' + err.message;
          resultEl.classList.remove('d-none');
        } finally {
          btn.disabled = false;
        }
      });

      // slider <-> number sync
      const slider = document.getElementById('slider');
      const num = document.getElementById('num');
      if (slider && num) {
        slider.addEventListener('input', () => { num.value = slider.value; });
        num.addEventListener('input', () => {
          let v = parseInt(num.value, 10);
          if (Number.isNaN(v)) v = 5;
          if (v < 5) v = 5;
          if (v > 100) v = 100;
          num.value = v;
          slider.value = v;
        });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
